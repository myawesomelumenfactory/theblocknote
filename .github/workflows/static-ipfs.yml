name: Build static assets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Stage data for the static build
        run: |
          mkdir -p public/data
          cp -f data/immutables.json public/data/immutables.json
          cp -f data/scripts.json public/data/scripts.json 2>/dev/null || true
          cp -f data/txids.json public/data/txids.json 2>/dev/null || true

      - name: Build
        run: npm run build

      - name: Zip static assets
        run: |
          cd dist
          zip -r ../theblocknote-static.zip .

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: theblocknote-static
          path: theblocknote-static.zip
          if-no-files-found: error
          retention-days: 90

      - name: Attach zip to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view static >/dev/null 2>&1; then
            gh release upload static theblocknote-static.zip --clobber
          else
            gh release create static theblocknote-static.zip \
              --title "Static assets" \
              --notes "Latest production build of The Block Note. Unzip and open, or serve the folder with any static file server."
          fi
